[tool.uv]
cache-dir = "./.uv_cache"

[project]
name = "mboprognose"
version = "0.1.0"
description = "MBO enrollment prediction model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "statsmodels>=0.14.0",
    "pyyaml>=6.0.1",
    "openpyxl>=3.1.2",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0",
    "xgboost>=2.0.0",
    "xlsxwriter>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["utils", "scripts"]
only-include = ["utils", "scripts", "main.py"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
